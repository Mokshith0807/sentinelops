services:
  mysql:
    image: mysql:8.0
    container_name: sentinelops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme-root}
      MYSQL_DATABASE: sentinelops
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-changeme-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: sentinelops-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sentinelops?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme-root}
      JWT_SECRET: ${JWT_SECRET:-SentinelOpsLiteSecretKeyForJWTAuthentication2026SuperSecureKey12345}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8484:8484"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8484/api}
    container_name: sentinelops-ui
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
