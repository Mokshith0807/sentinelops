spring.application.name=sentinelops-lite
server.port=8484

# Embedded H2 (MySQL compatibility mode) — demo/cloud profile, no external DB needed
spring.datasource.url=jdbc:h2:mem:sentinelops;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:SentinelOpsLiteSecretKeyForJWTAuthentication2026SuperSecureKey12345}
jwt.expiration=86400000

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

logging.level.org.springframework=INFO
