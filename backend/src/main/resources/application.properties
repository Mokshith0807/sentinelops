spring.application.name=sentinelops-lite

# ===============================
# SERVER
# ===============================
server.port=8484

# ===============================
# MYSQL (override with env vars in production)
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sentinelops}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:akki@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# CORS (comma-separated origin patterns)
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ===============================
# JWT (override with env var in production)
# ===============================
jwt.secret=${JWT_SECRET:SentinelOpsLiteSecretKeyForJWTAuthentication2026SuperSecureKey12345}
jwt.expiration=86400000

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

# Gemini AI (set GEMINI_API_KEY env var; fallback keeps local dev working)
gemini.api.key=${GEMINI_API_KEY:AQ.Ab8RN6JqNxr-Sg5uSDkpkdFoO3LEMNeIoQvcz1SaD5DfrMS2eg}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
